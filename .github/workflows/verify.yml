name: Verify SplitTrip React
on: [push, pull_request]
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm test
      - run: npm run build:emulator
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx firebase emulators:exec --config firebase.emulator.json --only auth,firestore,functions --project demo-splittrip-flutter 'npm run seed && npx vitest run --config vitest.legacy.config.ts && npm run test:browser && npm run test:engines'
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build:android:local
      - run: ./gradlew :app:assembleDebug :app:assembleLocal :app:testDebugUnitTest
        working-directory: android
